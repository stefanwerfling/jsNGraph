<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jsNGraph — network monitoring</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<nav id="nav">
    <span class="brand">jsNGraph</span>
    <a href="index.html">Overview</a>
    <a href="monitoring.html" class="active">Monitoring</a>
    <a href="layered.html">Layered flow</a>
    <a href="radial.html">Radial</a>
    <a href="kinds.html">Node gallery</a>
    <a href="api.html">API playground</a>
    <a href="explainer.html">Explainer</a>
    <a href="rect-explainer.html">Rect explainer</a>
    <a href="rect-autoroute.html">Auto-route</a>
</nav>

<div class="toolbar tl">
    <button id="toggle-theme">Toggle theme</button>
    <button id="toggle-labels">Toggle labels</button>
    <button id="fail-node">Simulate failure</button>
    <button id="recover-node">Recover</button>
    <label><input type="checkbox" id="toggle-jitter" checked> live jitter</label>
</div>

<div id="graph" class="graph-stage"></div>

<script src="../dist/jsngraph.global.js"></script>
<script>
    const nodes = [
        {id: 'router-1', label: 'Core Router', kind: 'router', status: 'ok', load: 0.4, ip: '10.0.0.1', fixed: true},
        {id: 'srv-1', label: 'App Server 1', kind: 'server', status: 'ok', load: 0.55, ip: '10.0.1.10'},
        {id: 'srv-2', label: 'App Server 2', kind: 'server', status: 'warning', load: 0.82, ip: '10.0.1.11'},
        {id: 'db-1', label: 'Primary DB', kind: 'database', status: 'ok', load: 0.3, ip: '10.0.2.5'},
        {id: 'db-2', label: 'Replica DB', kind: 'database', status: 'ok', load: 0.18, ip: '10.0.2.6'},
        {id: 'gw-1', label: 'Edge Gateway', kind: 'gateway', status: 'ok', load: 0.45, ip: '10.0.0.254'},
        {id: 'pc-1', label: 'Workstation A', kind: 'pc', status: 'ok', load: 0.12, ip: '10.0.10.21'},
        {id: 'pc-2', label: 'Workstation B', kind: 'pc', status: 'critical', load: 0.95, ip: '10.0.10.22'},
        {id: 'laptop-1', label: 'Laptop C', kind: 'laptop', status: 'ok', load: 0.2, ip: '10.0.10.30'},
        {id: 'tablet-1', label: 'Tablet D', kind: 'tablet', status: 'down', load: 0, ip: '10.0.10.40'}
    ];

    const edges = [
        {id: 'e1', source: 'router-1', target: 'srv-1', load: 0.5},
        {id: 'e2', source: 'router-1', target: 'srv-2', load: 0.85},
        {id: 'e3', source: 'srv-1', target: 'db-1', load: 0.35},
        {id: 'e4', source: 'srv-2', target: 'db-1', load: 0.6},
        {id: 'e5', source: 'db-1', target: 'db-2', load: 0.15},
        {id: 'e6', source: 'router-1', target: 'gw-1', load: 0.45},
        {id: 'e7', source: 'gw-1', target: 'pc-1', load: 0.15},
        {id: 'e8', source: 'gw-1', target: 'pc-2', load: 0.95},
        {id: 'e9', source: 'gw-1', target: 'laptop-1', load: 0.25},
        {id: 'e10', source: 'gw-1', target: 'tablet-1', load: 0, animated: false}
    ];

    const graph = new JSNGraph.NGraph(document.getElementById('graph'), {theme: 'dark'});
    graph.setData(nodes, edges);

    graph.on('nodeClick', (node) => { if (node) console.log('clicked', node.id); });

    let dark = true;
    document.getElementById('toggle-theme').addEventListener('click', () => {
        dark = !dark;
        graph.setTheme(dark ? 'dark' : 'light');
        document.body.style.background = dark ? '#0f1420' : '#f4f6fb';
    });

    let labels = true;
    document.getElementById('toggle-labels').addEventListener('click', () => {
        labels = !labels;
        graph.setShowLabels(labels);
    });

    document.getElementById('fail-node').addEventListener('click', () => {
        graph.updateNode('srv-1', {status: 'down', load: 0});
        graph.updateEdge('e3', {load: 0, animated: false});
    });
    document.getElementById('recover-node').addEventListener('click', () => {
        graph.updateNode('srv-1', {status: 'ok', load: 0.55});
        graph.updateEdge('e3', {load: 0.35, animated: true});
    });

    // Live-monitoring feel: jitter loads periodically like real traffic.
    let jitter = true;
    document.getElementById('toggle-jitter').addEventListener('change', (ev) => { jitter = ev.target.checked; });

    setInterval(() => {
        if (!jitter) return;
        for (const n of nodes) {
            if (n.status === 'down') continue;
            const v = Math.max(0, Math.min(1, n.load + (Math.random() - 0.5) * 0.15));
            graph.updateNode(n.id, {load: v});
        }
        for (const e of edges) {
            if (e.animated === false) continue;
            const v = Math.max(0, Math.min(1, e.load + (Math.random() - 0.5) * 0.15));
            graph.updateEdge(e.id, {load: v});
        }
    }, 1200);
</script>
</body>
</html>
