<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="shared.css">
<style>
    :root {
        --jsng-background: #0f1420;
        --jsng-node-label: #aab6cc;
        --jsng-edge-neutral: #2c3850;
        --jsng-highlight-stroke: #f1c40f;
    }
    #status {
        position: absolute;
        z-index: 30;
        left: 14px;
        bottom: 14px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(26, 34, 54, 0.85);
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-dim);
    }
</style>
</head>
<body>
<nav id="nav">
    <span class="brand">jsNGraph</span>
    <a href="index.html">Overview</a>
    <a href="monitoring.html">Monitoring</a>
    <a href="layered.html">Layered flow</a>
    <a href="radial.html">Radial</a>
    <a href="knowledge.html">Knowledge</a>
    <a href="vault.html">Large vault</a>
    <a href="atlas.html" class="active">Atlas</a>
    <a href="kinds.html">Node gallery</a>
    <a href="api.html">API playground</a>
    <a href="explainer.html">Explainer</a>
    <a href="rect-autoroute.html">Auto-route</a>
</nav>

<div class="toolbar tl">
    <label>Notes
        <select id="count">
            <option value="20000">20 000</option>
            <option value="50000" selected>50 000</option>
            <option value="100000">100 000</option>
        </select>
    </label>
    <label><input id="clusters" type="checkbox" checked> Aggregate when zoomed out</label>
    <button id="pulse">Pulse 50</button>
    <button id="fit">Fit</button>
</div>

<div id="graph" class="graph-stage"></div>
<div id="status">…</div>

<script src="../dist/jsngraph.global.js"></script>
<script>
    const {NGraph, Theme, EdgeKindPresets, RectRandom} = JSNGraph;
    const stage = document.getElementById('graph');
    const status = document.getElementById('status');
    let graph = null;
    let data = null;

    /**
     * A synthetic vault laid out like a server-side community layout:
     * communities packed on a grid, notes on a golden-angle spiral inside
     * their tile. Clusters and the edges between them come precomputed too.
     */
    function makeAtlas(count) {
        const rnd = new RectRandom(11);
        const sizes = [];
        let left = count;

        while (left > 0) {
            const size = Math.min(left, 20 + Math.floor(rnd.next() * rnd.next() * 1500));
            sizes.push(size);
            left -= size;
        }

        sizes.sort((a, b) => b - a);
        const cols = Math.ceil(Math.sqrt(sizes.length));
        const tile = 28 * Math.sqrt(sizes[0]) * 2 + 160;
        const nodes = [];
        const clusters = [];
        const community = [];
        const golden = Math.PI * (3 - Math.sqrt(5));

        sizes.forEach((size, c) => {
            const cx = (c % cols) * tile + tile / 2;
            const cy = Math.floor(c / cols) * tile + tile / 2;
            const ids = [];

            for (let i = 0; i < size; i++) {
                const r = 28 * Math.sqrt(i + 1);
                const id = 'n' + nodes.length;
                ids.push(id);
                community.push(c);
                nodes.push({id: id, label: 'note-' + nodes.length, shape: 'dot', group: 'c' + c,
                    size: 3 + Math.min(4, rnd.next() * 4), x: cx + r * Math.cos(i * golden), y: cy + r * Math.sin(i * golden)});
            }

            clusters.push({id: 'c' + c, x: cx, y: cy, size: size, nodeIds: ids, label: 'community ' + c});
        });

        const edges = [];
        const between = new Map();

        for (let i = 1; i < nodes.length; i++) {
            const same = rnd.next() < 0.9;
            const c = community[i];
            const pool = clusters[c].nodeIds;
            const target = same ? pool[Math.floor(rnd.next() * pool.length)] : 'n' + Math.floor(rnd.next() * nodes.length);
            if (target === nodes[i].id) continue;
            edges.push({id: 'e' + i, source: nodes[i].id, target: target, kind: 'wikilink'});

            const tc = community[Number(target.slice(1))];
            if (tc !== c) {
                const key = Math.min(c, tc) + ':' + Math.max(c, tc);
                between.set(key, (between.get(key) ?? 0) + 1);
            }
        }

        const clusterEdges = [...between].map(([key, weight]) => {
            const [a, b] = key.split(':');
            return {source: 'c' + a, target: 'c' + b, weight: weight};
        });

        return {nodes, edges, clusters, clusterEdges};
    }

    function build() {
        if (graph !== null) graph.destroy();

        data = makeAtlas(Number(document.getElementById('count').value));
        graph = new NGraph(stage, {
            theme: Theme.fromCssVars(document.documentElement, {base: Theme.dark}),
            layoutMode: 'static',
            panZoom: true,
            detailPanel: false,
            draggable: false,
            lasso: false,
            grid: false,
            minZoom: 0.01,
            maxZoom: 40,
            labelMinZoom: 1.5,
            edgeMinZoom: 0.6,
            clusterZoom: 0.25,
            edgeKinds: {wikilink: {tone: 'neutral', width: 0.6, animated: false}},
            tooltip: (node) => node.label
        });
        graph.setData(data.nodes, data.edges);
        applyClusters();
        graph.fit({padding: 20});
        graph.on('clusterClick', (id) => graph.focusCluster(id, {animate: true}));
        window.graph = graph;
    }

    function applyClusters() {
        if (typeof graph.setClusters !== 'function') return;
        graph.setClusters(document.getElementById('clusters').checked ? data.clusters : [], data.clusterEdges);
    }

    /**
     * Synchronous frame timing (rAF is throttled in background/automation
     * tabs): draw `n` frames at a zoom level and report the median in ms.
     */
    window.measure = function (scales = [0.02, 0.1, 0.3, 0.8, 2], n = 7) {
        const out = {};
        for (const s of scales) {
            graph.zoomTo(s);
            graph['frame'](performance.now());
            const times = [];
            for (let i = 0; i < n; i++) {
                const t = performance.now();
                graph['frame'](performance.now());
                times.push(performance.now() - t);
            }
            times.sort((a, b) => a - b);
            out[s] = Number(times[Math.floor(n / 2)].toFixed(1));
        }
        graph.fit({padding: 20});
        return out;
    };

    document.getElementById('pulse').addEventListener('click', () => {
        graph.pulse(Array.from({length: 50}, () => data.nodes[Math.floor(Math.random() * data.nodes.length)].id), '#34d399');
    });
    document.getElementById('fit').addEventListener('click', () => graph.fit({animate: true, padding: 20}));
    document.getElementById('count').addEventListener('change', build);
    document.getElementById('clusters').addEventListener('change', applyClusters);

    let zoomText = '';
    setInterval(() => {
        if (graph === null) return;
        zoomText = 'zoom ' + graph.getViewport().scale.toFixed(3);
        status.textContent = data.nodes.length + ' notes · ' + data.edges.length + ' links · ' + data.clusters.length + ' communities · ' + zoomText;
    }, 250);

    build();
</script>
</body>
</html>
