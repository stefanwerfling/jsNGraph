<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jsNGraph — net view</title>
<link rel="stylesheet" href="shared.css">
<style>
    .toolbar.bl { top: auto; bottom: 14px; left: 14px; right: 14px; }
    .toolbar .sep { width: 1px; height: 20px; background: var(--border); }
    .toolbar .note { font-size: 11px; color: var(--text-dim); margin-left: auto; }
    #drop.over { outline: 2px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>
<nav id="nav">
    <span class="brand">jsNGraph</span>
    <a href="index.html">Overview</a>
    <a href="modelview.html">Model view</a>
    <a href="netview.html" class="active">Net view</a>
    <a href="workflow.html">Workflow</a>
</nav>

<div id="drop" class="graph-stage"></div>

<div class="toolbar bl">
    <label>Model <select id="model"></select></label>
    <label>Prompt <select id="prompt"></select></label>
    <label>Bins <input id="bins" type="range" min="16" max="96" step="8" value="48"><span id="binsOut">48</span></label>
    <span class="sep"></span>
    <button id="replay">Replay</button>
    <button id="anim">Pause flow</button>
    <button id="fit">Fit</button>
    <button id="theme">Light</button>
    <button id="load">Load Hugin JSON…</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <span class="note" id="note">simulated traces · drop a Hugin JSON to show a real one</span>
</div>

<script src="../dist/jsngraph.global.js"></script>
<script>
    const { NetView, NetHugin } = window.JSNGraph;

    // Model shapes only — the traces below are simulated, not measured.
    const MODELS = {
        moe: {name: 'hybrid MoE · 40 blocks', hidden: 2048, blocks: 40, heads: 16, kvHeads: 2, experts: 256, expertsPerToken: 8,
            blockKinds: Array.from({length: 40}, (_, i) => (i % 4 === 3 ? 'full attention' : 'linear attention'))},
        dense: {name: 'dense · 34 blocks', hidden: 2560, blocks: 34, heads: 8, kvHeads: 4,
            blockKinds: Array.from({length: 34}, (_, i) => (i % 6 === 5 ? 'global' : 'sliding'))},
        small: {name: 'small dense · 24 blocks', hidden: 896, blocks: 24, heads: 14, kvHeads: 2}
    };

    const PROMPTS = [
        {text: 'Die Hauptstadt von Frankreich ist', answer: ' Paris', near: [' Lyon', ' die', ' eine', ' Marseille'], key: 'Frankreich', settle: 0.62},
        {text: 'def add(a, b):\n    return', answer: ' a', near: [' b', ' sum', ' (', ' self'], key: 'add', settle: 0.48},
        {text: 'The opposite of hot is', answer: ' cold', near: [' warm', ' cool', ' not', ' the'], key: 'hot', settle: 0.7},
        {text: '17 + 25 =', answer: ' 42', near: [' 32', ' 41', ' 43', ' 17'], key: '+', settle: 0.82}
    ];
    const JUNK = [',', ' the', ' of', ' and', '.', ' in', ' a', ' to', '\n', ' is'];

    // Seeded randomness so a prompt always draws the same picture.
    function rng(seed) {
        let s = seed >>> 0;
        return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    }
    const hash = (str) => [...str].reduce((h, c) => (Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0), 2166136261);
    const gauss = (r) => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r());
    const sig = (x) => 1 / (1 + Math.exp(-x));

    /** A plausible trace in the shape of Hugin's tool outputs (logit_lens, activations, attention_pattern, expert_usage). */
    function simulate(model, p) {
        const r = rng(hash(p.text + model.name));
        const pieces = p.text.match(/\s*[^\s]+|\n/g) ?? [p.text];
        const position = pieces.length - 1;
        const keyPos = Math.max(0, pieces.findIndex((t) => t.includes(p.key)));
        const B = model.blocks, d = model.hidden;
        const outliers = [Math.floor(d * 0.07), Math.floor(d * 0.71)];
        const concept = Array.from({length: 10}, () => Math.floor(r() * d));
        const settle = p.settle * (B - 1);
        let prev = null;
        const lensBlocks = [], actBlocks = [], attention = [], moeBlocks = [];

        for (let b = 0; b < B; b++) {
            const t = b / (B - 1);
            const ans = 0.92 * sig((b - settle) / 1.6);
            const values = new Array(d);

            for (let i = 0; i < d; i++) {
                values[i] = gauss(r) * (0.6 + 2.2 * t) + (prev ? prev[i] * 0.35 : 0);
            }
            outliers.forEach((i, n) => { values[i] = (n ? -1 : 1) * (18 + 60 * t); });
            concept.forEach((i, n) => { values[i] += (n % 3 ? 1 : -1) * 14 * sig((b - settle + 4) / 2.5); });

            // Lens: junk early, related words in the middle, the answer late.
            const rest = 1 - ans;
            const mid = sig((b - settle * 0.6) / 2) * rest;
            const top = [
                {piece: p.answer, prob: ans},
                ...p.near.map((piece, i) => ({piece, prob: mid * (0.35 / (i + 1)) * (0.7 + 0.6 * r())})),
                ...JUNK.slice(0, 4).map((piece) => ({piece, prob: (rest - mid) * 0.25 * r()}))
            ].sort((a, b2) => b2.prob - a.prob).slice(0, 5);
            const entropy = -top.reduce((s, x) => s + (x.prob > 0 ? x.prob * Math.log(x.prob) : 0), 0) + 4.5 * (1 - t) * rest;
            const rank = top.findIndex((x) => x.piece === p.answer);

            lensBlocks.push({block: b, entropy, final_token_prob: ans, final_token_rank: rank < 0 ? 5 + Math.floor(r() * 300 * (1 - t)) : rank, top});

            const l2 = Math.sqrt(values.reduce((s, v) => s + v * v, 0));
            const act = {block: b, l2, values};
            if (prev) {
                let dsq = 0, dot = 0, psq = 0;
                for (let i = 0; i < d; i++) { dsq += (values[i] - prev[i]) ** 2; dot += values[i] * prev[i]; psq += prev[i] ** 2; }
                act.update_l2 = Math.sqrt(dsq);
                act.cos_prev_block = dot / Math.sqrt(psq * l2 * l2);
            }
            actBlocks.push(act);
            prev = values;

            // Heads: a few look hard at the key token, the rest spread out.
            const perHead = [];
            for (let h = 0; h < model.heads; h++) {
                const focused = r() < 0.15 + 0.35 * sig((b - settle) / 3);
                const target = focused ? keyPos : Math.floor(r() * pieces.length);
                const weight = focused ? 0.55 + 0.4 * r() : 0.15 + 0.3 * r();
                perHead.push({head: h, entropy: (1 - weight) * Math.log(Math.max(2, pieces.length)) * 1.1,
                    top: [{pos: target, token: pieces[target], weight}]});
            }
            attention.push({block: b, heads: model.heads, kv_heads: model.kvHeads, per_head: perHead});

            if (model.experts) {
                const picks = new Set();
                while (picks.size < model.expertsPerToken) picks.add(Math.floor((r() ** 1.6) * model.experts));
                const w = [...picks].map(() => r() + 0.2);
                const ws = w.reduce((a, x) => a + x, 0);
                const load = new Map();
                for (let k = 0; k < model.expertsPerToken * pieces.length; k++) {
                    const e = Math.floor((r() ** 1.3) * model.experts);
                    load.set(e, (load.get(e) ?? 0) + 1);
                }
                moeBlocks.push({block: b, k: model.expertsPerToken,
                    top_by_count: [...load].map(([expert, tokens]) => ({expert, tokens})),
                    picks_at_position: [...picks].map((expert, i) => ({expert, weight: w[i] / ws}))});
            }
        }

        const last = lensBlocks[B - 1].top;
        return {
            prompt: p.text,
            tokenize: {pieces},
            next_token: {top: last},
            logit_lens: {position, final_prediction: {piece: p.answer, prob: lensBlocks[B - 1].final_token_prob}, blocks: lensBlocks},
            activations: {d_model: d, position, blocks: actBlocks},
            attention_pattern: attention,
            expert_usage: model.experts ? {experts: model.experts, position, blocks: moeBlocks} : undefined
        };
    }

    const $ = (id) => document.getElementById(id);
    let view = null;
    let light = false;
    let animate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    let current = null; // {model, trace}

    function build() {
        view?.destroy();
        view = new NetView($('drop'), {theme: light ? 'light' : 'dark', bins: Number($('bins').value), animate});
        view.on('blockClick', (e) => { if (e) console.log('blockClick', e.block, e.data); });
        if (current) {
            view.setModel(current.model);
            view.setTrace(current.trace);
        }
        window.view = view;
    }

    function show(outputs, modelShape) {
        const model = NetHugin.model(outputs, modelShape);
        current = {model, trace: NetHugin.trace(outputs)};
        view.setModel(current.model);
        view.setTrace(current.trace);
    }

    function runSimulated() {
        const shape = MODELS[$('model').value];
        show(simulate(shape, PROMPTS[Number($('prompt').value)]), shape);
        $('note').textContent = 'simulated trace · drop a Hugin JSON to show a real one';
    }

    for (const [id, m] of Object.entries(MODELS)) $('model').add(new Option(m.name, id));
    PROMPTS.forEach((p, i) => $('prompt').add(new Option(p.text.replace(/\n\s*/g, ' ⏎ '), String(i))));
    $('model').onchange = runSimulated;
    $('prompt').onchange = runSimulated;
    $('bins').oninput = () => { $('binsOut').textContent = $('bins').value; build(); };
    $('replay').onclick = () => view.replay();
    $('fit').onclick = () => view.fit();
    $('anim').onclick = () => {
        animate = !animate;
        view.setAnimate(animate);
        $('anim').textContent = animate ? 'Pause flow' : 'Play flow';
    };
    $('theme').onclick = () => {
        light = !light;
        view.setTheme(light ? 'light' : 'dark');
        $('theme').textContent = light ? 'Dark' : 'Light';
    };

    // Real data: one JSON object {prompt, tokenize, logit_lens, activations, attention_pattern: [...], expert_usage}
    // collected from Hugin's forward tools for the same text.
    async function loadFile(file) {
        try {
            const outputs = JSON.parse(await file.text());
            show(outputs, outputs.model ?? {});
            $('note').textContent = `${file.name} · ${view.getModel().blocks} blocks`;
        } catch (err) {
            $('note').textContent = `could not read ${file.name}: ${err.message}`;
        }
    }
    $('load').onclick = () => $('file').click();
    $('file').onchange = () => { if ($('file').files[0]) loadFile($('file').files[0]); };
    $('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
    $('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
    $('drop').addEventListener('drop', (e) => {
        e.preventDefault();
        $('drop').classList.remove('over');
        if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    build();
    runSimulated();
</script>
</body>
</html>
